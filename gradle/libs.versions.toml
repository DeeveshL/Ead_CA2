[versions]
agp = "8.9.2"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
composeBom = "2024.09.00"
coil = "2.4.0"
navigation-compose = "2.7.0"

msal = "2.3.0"
retrofit        = "2.9.0"
converter-gson  = "2.9.0"
okhttp          = "4.10.0"

firebase-bom            = "32.2.0"
firebase-auth-ktx       = "21.1.0"
firebase-storage-ktx    = "20.2.0"
firebase-firestore-ktx  = "24.7.1"
kotlinx-coroutines-play-services = "1.7.3"
google-services = "4.4.2"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

msal = { module = "com.microsoft.identity.client:msal", version.ref = "msal" }
retrofit        = { module = "com.squareup.retrofit2:retrofit",        version.ref = "retrofit" }
converter-gson  = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converter-gson" }
okhttp          = { module = "com.squareup.okhttp3:okhttp",           version.ref = "okhttp" }

firebase-auth-ktx = { group = "com.google.firebase", name = "firebase-auth-ktx", version.ref = "firebase-auth-ktx" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines-play-services" }
firebase-storage-ktx    = { module = "com.google.firebase:firebase-storage-ktx",    version.ref = "firebase-storage-ktx" }
firebase-firestore-ktx  = { module = "com.google.firebase:firebase-firestore-ktx",  version.ref = "firebase-firestore-ktx" }
firebase-bom            = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }


coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
navigation-compose      = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "google-services" }

